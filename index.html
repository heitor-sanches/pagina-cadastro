<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
</head>
<body>
    <h1>Cadastro</h1>
    <form id="cadastroForm">
        <label>CPF: </label>
        <input type="text" id="cpf" required><br><br>
        
        <label>Senha: </label>
        <input type="password" id="senha" required><br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>

    <script src="script.js"></script>
</body>
</html>
